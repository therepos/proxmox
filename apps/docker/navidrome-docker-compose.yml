services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    ports:
      - "3012:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANINTERVAL: 1140m
      ND_LOGLEVEL: info
      ND_PORT: 4533
      ND_SESSIONTIMEOUT: "168h"
      # Do not index the public downloads staging folder (metube writes here);
      # keeps public grabs out of the library and avoids 'missing' ghosts on move.
      ND_SCANNER_IGNOREDPATTERNS: "downloads/**"
      # Purge DB entries whose files are gone (e.g. moved out of downloads) on full scans.
      ND_SCANNER_PURGEMISSING: "full"
    volumes:
      - "/mnt/sec/apps/navidrome/data:/data"
      - "/mnt/sec/media/music:/music"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
