services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    ports:
      - "3012:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANINTERVAL: 1140m
      ND_LOGLEVEL: info
      ND_PORT: 4533
      ND_SESSIONTIMEOUT: "168h"
      # The public downloads staging folder (metube writes to /music/downloads) is
      # kept out of the library by a blank .ndignore file in that folder, which the
      # metube-tag overlay creates. Scanner.IgnoredPatterns does NOT reliably exclude
      # it (still indexed on Navidrome 0.63), so .ndignore is the mechanism used.
      # Purge DB entries whose files are gone (e.g. moved out of downloads) on full scans.
      ND_SCANNER_PURGEMISSING: "full"
    volumes:
      - "/mnt/sec/apps/navidrome/data:/data"
      - "/mnt/sec/media/music:/music"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
