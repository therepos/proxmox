name: Lint
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    # bot pushes are skipped, except the re-run this job dispatches after a fix
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          # on a PR, check out the branch itself so fixes can be pushed to it
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Fix what can be fixed safely
        run: bash scripts/lint.sh --fix || true

      - name: Commit fixes
        # forks cannot be pushed to; their PRs just get the report below
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "lint: auto-fix one-liners and shared blocks"
            git pull --rebase
            git push
            # a push made with GITHUB_TOKEN starts no workflow, so the fixed commit
            # would have no lint result; start one so required checks can pass
            gh workflow run ci-lint.yml --ref "$BRANCH"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Lint
        run: bash scripts/lint.sh
